name: PHP CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write
  packages: write   
  
jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0
    
    # Generar un tag basado en la fecha y hora
    - name: Generate release tag
      id: tag
      run: |
        echo "TAG_NAME=release-$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_ENV

    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.0'
    
    - name: Validate PHP syntax
      run: |
        find . -name "*.php" -exec php -l {} \;
    
    - name: Navigate to the system directory
      run: cd sistema
    
    - name: Install dependencies
      run: composer install --prefer-dist --no-progress
      working-directory: ./sistema
    
    - name: Create Artifact (ZIP)
      run: |
        cd sistema
        zip -r ../php_app.zip .
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v3  
      with:
        name: php_app
        path: php_app.zip