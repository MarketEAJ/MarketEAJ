name: PHP CI
#test
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Generate release tag
      id: tag
      run: |
        echo "TAG_NAME=release-$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_ENV

    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.1'
        extensions: mbstring, xml, pdo, pdo_mysql
        coverage: xdebug

    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v4
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
        restore-keys: ${{ runner.os }}-php-

    - name: Validate composer.json
      run: |
        if [ -f "./sistema/composer.json" ]; then
          cd ./sistema && composer validate
        fi

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress
      working-directory: ./sistema

    - name: Check PHP syntax
      run: |
        find . -name "*.php" -not -path "./vendor/*" -print0 | xargs -0 -n1 php -l

    - name: Create artifact
      run: |
        # Excluir archivos innecesarios
        echo "vendor/" > ./sistema/.artifactignore
        echo "tests/" >> ./sistema/.artifactignore
        echo "*.git*" >> ./sistema/.artifactignore
        echo "*.env*" >> ./sistema/.artifactignore
        
        cd sistema
        zip -r ../php_app.zip . -x@.artifactignore

    - name: Verify artifact before upload
      run: |
        ls -la php_app.zip  # Verifica que el archivo exista antes de subirlo

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: php_app
        path: php_app.zip
        retention-days: 5

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ env.TAG_NAME }}
        name: ${{ env.TAG_NAME }}
        body: "Automated release for ${{ env.TAG_NAME }}"
        files: php_app.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}