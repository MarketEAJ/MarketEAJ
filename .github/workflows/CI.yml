# Cambios significativos en tu CI original:

- name: Set up PHP
  uses: shivammathur/setup-php@v2
  with:
    php-version: '8.0'
    extensions: mbstring, xml, pdo, pdo_mysql  # 👈 AÑADIDO: Extensiones necesarias
    coverage: xdebug                           # 👈 AÑADIDO: Soporte para cobertura

- name: Cache Composer packages              # 👈 AÑADIDO: Nuevo paso completo
  id: composer-cache
  uses: actions/cache@v3
  with:
    path: vendor
    key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
    restore-keys: ${{ runner.os }}-php-

- name: Validate composer.json               # 👈 AÑADIDO: Nuevo paso completo
  run: |
    if [ -f "./sistema/composer.json" ]; then
      cd ./sistema && composer validate
    fi

- name: Check PHP syntax                     # 👈 MODIFICADO: Mejorado para excluir vendor
  run: |
    find . -name "*.php" -not -path "./vendor/*" -print0 | xargs -0 -n1 php -l

- name: Create artifact                      # 👈 MODIFICADO: Mejor manejo de exclusiones
  run: |
    # Excluir archivos innecesarios
    echo "vendor/" > ./sistema/.artifactignore
    echo "tests/" >> ./sistema/.artifactignore
    echo "*.git*" >> ./sistema/.artifactignore
    echo "*.env*" >> ./sistema/.artifactignore
    
    cd sistema
    zip -r ../php_app.zip . -x@.artifactignore