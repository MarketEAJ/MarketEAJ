name: PHP CI

on:
  push:
    branches:
      - devs
  pull_request:
    branches:
      - devs

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # [Previous steps remain the same...]

    - name: Verify CD Workflow
      run: |
        if [ ! -f ".github/workflows/CD.yml" ]; then
          echo "Error: CD workflow file not found"
          exit 1
        fi
        echo "CD workflow file found, proceeding with release"
      
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ env.TAG_NAME }}
        name: ${{ env.TAG_NAME }}
        body: |
          Automated release for ${{ env.TAG_NAME }}
          CD Trigger Status: Ready for deployment
        files: php_app.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}