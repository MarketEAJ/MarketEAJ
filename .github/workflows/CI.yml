name: PHP CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.0'

    - name: Validate PHP syntax
      run: |
        find . -name "*.php" -exec php -l {} \;

    - name: Navigate to the system directory
      run: cd sistema

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress
      working-directory: ./sistema  

    # Crear el artefacto
    - name: Create Artifact (ZIP)
      run: |
        cd sistema  
        zip -r ../my_project_artifact.zip .  

    # Subir el artefacto a GitHub Releases
    - name: Upload Artifact to GitHub Releases
      uses: softprops/action-gh-release@v1
      with:
        files: my_project_artifact.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Autenticación usando el token de GitHub
