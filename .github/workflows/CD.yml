name: PHP CD

#test 20
on:
  workflow_run:
    workflows: ["PHP CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    
    steps:
    - name: Verify XAMPP Installation
      shell: cmd
      run: |
        if not exist "C:\xampp" (
          echo "Error: XAMPP no está instalado en la ruta predeterminada"
          exit 1
        )
        if not exist "C:\xampp\apache" (
          echo "Error: Directorio de Apache no encontrado"
          exit 1
        )
        if not exist "C:\xampp\mysql" (
          echo "Error: Directorio de MySQL no encontrado"
          exit 1
        )

    - name: Manage Services
      shell: powershell
      run: |
        # Listar todos los servicios para depuración
        Get-Service | Where-Object {$_.Name -like '*apache*' -or $_.Name -like '*mysql*'}
        
        # Detener Apache si está en ejecución
        try {
          Stop-Service -Name "Apache2.4" -Force -ErrorAction Stop
        } catch {
          Write-Host "No se pudo detener el servicio Apache2.4"
        }

        # Detener MySQL si está en ejecución
        try {
          Stop-Service -Name "MySQL" -Force -ErrorAction Stop
        } catch {
          Write-Host "No se pudo detener el servicio MySQL"
        }

        # Iniciar Apache
        try {
          Start-Service -Name "Apache2.4" -ErrorAction Stop
        } catch {
          Write-Host "No se pudo iniciar el servicio Apache2.4"
        }

        # Iniciar MySQL
        try {
          Start-Service -Name "MySQL" -ErrorAction Stop
        } catch {
          Write-Host "No se pudo iniciar el servicio MySQL"
        }

        Start-Sleep -Seconds 10

    - name: Verify Services Are Running
      shell: cmd
      run: |
        echo "Verificando que los servicios están corriendo..."
        sc query apache2.4 | findstr /i "RUNNING"
        if %errorlevel% neq 0 (
          echo "Error: Apache no se inició correctamente"
          exit 1
        )
        sc query mysql | findstr /i "RUNNING"
        if %errorlevel% neq 0 (
          echo "Error: MySQL no se inició correctamente"
          exit 1
        )

    - name: Get latest release
      uses: actions/github-script@v7
      id: get-latest-release
      with:
        script: |
          const release = await github.rest.repos.getLatestRelease({
            owner: context.repo.owner,
            repo: context.repo.repo
          });
          return release.data.assets[0].browser_download_url;

    - name: Download release asset
      shell: cmd
      run: |
        bitsadmin /transfer mydownloadjob /download /priority normal "${{ steps.get-latest-release.outputs.result }}" "%CD%\php_app.zip"

    - name: Deploy to XAMPP
      shell: cmd
      run: |
        set XAMPP_PATH=C:\xampp\htdocs
        set APP_PATH=%XAMPP_PATH%\marketeaj

        echo "Limpiando la carpeta de despliegue..."
        if exist "%APP_PATH%" rd /s /q "%APP_PATH%"

        echo "Creando directorio de la aplicación..."
        mkdir "%APP_PATH%"

        echo "Extrayendo archivos..."
        powershell -Command "Expand-Archive -Path php_app.zip -DestinationPath '%APP_PATH%' -Force"

        echo "Estableciendo permisos de acceso..."
        icacls "%APP_PATH%" /grant "Users":(OI)(CI)F /T
        icacls "%APP_PATH%" /grant "IIS_IUSRS":(OI)(CI)F /T
