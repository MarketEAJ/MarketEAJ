name: PHP CD

on:
  workflow_run:
    workflows: ["PHP CI"]
    types: [completed]
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    
    steps:
    - name: Download artifact
      uses: dawidd6/action-download-artifact@v2
      with:
        workflow: php-ci.yml
        name: php_app
        path: .
        
    - name: Deploy to XAMPP
      shell: cmd
      run: |
        @echo off
        
        set XAMPP_PATH=C:\xampp\htdocs
        set APP_PATH=%XAMPP_PATH%\marketeaj
        set BACKUP_PATH=%APP_PATH%_backup
        
        echo "Creating backup of current deployment..."
        if exist "%APP_PATH%" (
          if exist "%BACKUP_PATH%" rmdir /s /q "%BACKUP_PATH%"
          move "%APP_PATH%" "%BACKUP_PATH%"
        )
        
        echo "Creating fresh directory..."
        mkdir "%APP_PATH%"
        
        echo "Extracting new version..."
        powershell -Command "Expand-Archive -Path php_app.zip -DestinationPath '%APP_PATH%' -Force"
        
        echo "Setting permissions..."
        icacls "%APP_PATH%" /grant "Everyone":(OI)(CI)F /T
        
        echo "Installing dependencies..."
        cd "%APP_PATH%"
        C:\composer\composer.bat install --no-dev --optimize-autoloader
        
        echo "Deployment complete!"