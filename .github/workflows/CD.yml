name: PHP CD
on:
  workflow_run:
    workflows: ["PHP CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    
    steps:
    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: php_app
        run-id: ${{ github.event.workflow_run.id }}
        
    - name: Verify download
      run: |
        echo "Current directory contents:"
        dir
        echo "Checking for php_app.zip:"
        if exist php_app.zip (
          echo "Found php_app.zip"
        ) else (
          echo "php_app.zip not found"
          exit 1
        )


        