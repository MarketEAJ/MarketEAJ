name: PHP CD
on:
  workflow_run:
    workflows: ["PHP CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    
    steps:
    - name: Verify XAMPP Installation
      shell: cmd
      run: |
        if not exist "C:\xampp" (
          echo "Error: XAMPP no está instalado en la ruta predeterminada"
          exit 1
        )
        if not exist "C:\xampp\apache" (
          echo "Error: Directorio de Apache no encontrado"
          exit 1
        )
        if not exist "C:\xampp\mysql" (
          echo "Error: Directorio de MySQL no encontrado"
          exit 1
        )

    - name: Stop Existing Services with Elevated Privileges
      shell: powershell
      run: |
        Start-Process "sc" -ArgumentList "stop apache2.4" -Verb RunAs -Wait
        Start-Process "sc" -ArgumentList "stop mysql" -Verb RunAs -Wait
        Start-Sleep -Seconds 5

    - name: Start Apache and MySQL Services with Elevated Privileges
      shell: powershell
      run: |
        Start-Process "sc" -ArgumentList "start apache2.4" -Verb RunAs -Wait
        Start-Process "sc" -ArgumentList "start mysql" -Verb RunAs -Wait
        Start-Sleep -Seconds 10

    - name: Verify Services Are Running
      shell: powershell
      run: |
        $apacheStatus = (Get-Service -Name "apache2.4").Status
        $mysqlStatus = (Get-Service -Name "mysql").Status
        
        if ($apacheStatus -ne "Running") {
          Write-Error "Apache service is not running"
          exit 1
        }
        
        if ($mysqlStatus -ne "Running") {
          Write-Error "MySQL service is not running"
          exit 1
        }

    - name: Get latest release
      uses: actions/github-script@v7
      id: get-latest-release
      with:
        script: |
          const release = await github.rest.repos.getLatestRelease({
            owner: context.repo.owner,
            repo: context.repo.repo
          });
          return release.data.assets[0].browser_download_url;

    - name: Download release asset
      shell: cmd
      run: |
        bitsadmin /transfer mydownloadjob /download /priority normal "${{ steps.get-latest-release.outputs.result }}" "%CD%\php_app.zip"
        
    - name: Deploy to XAMPP
      shell: cmd
      run: |
        set XAMPP_PATH=C:\xampp\htdocs
        set APP_PATH=%XAMPP_PATH%\marketeaj
        
        echo "Cleaning up old deployment..."
        if exist "%APP_PATH%" rd /s /q "%APP_PATH%"
        
        echo "Creating directory..."
        mkdir "%APP_PATH%"
        
        echo "Extracting files..."
        powershell -Command "Expand-Archive -Path php_app.zip -DestinationPath '%APP_PATH%' -Force"
        
        echo "Setting permissions..."
        icacls "%APP_PATH%" /grant "Users":(OI)(CI)F /T
        icacls "%APP_PATH%" /grant "IIS_IUSRS":(OI)(CI)F /T
