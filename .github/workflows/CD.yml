name: PHP CD

on:
  workflow_run:
    workflows: ["PHP CI"]
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    
    steps:
    - name: Download artifact
      uses: actions/download-artifact@v3
      with:
        name: php_app
        
    - name: List files
      run: dir
      shell: cmd

    - name: Deploy to XAMPP
      shell: cmd
      run: |
        if not exist "C:\xampp\htdocs\marketeaj" mkdir "C:\xampp\htdocs\marketeaj"
        del /f /s /q "C:\xampp\htdocs\marketeaj\*.*"
        powershell Expand-Archive -Path php_app.zip -DestinationPath "C:\xampp\htdocs\marketeaj" -Force
        cd "C:\xampp\htdocs\marketeaj"
        composer install --no-dev
        icacls "C:\xampp\htdocs\marketeaj" /grant Everyone:F /T