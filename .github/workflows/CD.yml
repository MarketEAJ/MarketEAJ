name: PHP CD

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: self-hosted
    
    steps:
    - name: Download release
      shell: powershell
      run: |
        $tag = "${{ github.event.release.tag_name }}"
        $url = "${{ github.event.release.assets[0].browser_download_url }}"
        Invoke-WebRequest -Uri $url -OutFile "php_app.zip"

    - name: Deploy to XAMPP
      shell: cmd
      run: |
        # Crear carpeta marketeaj si no existe
        if not exist "C:\xampp\htdocs\marketeaj" mkdir "C:\xampp\htdocs\marketeaj"
        
        # Limpiar la carpeta existente
        del /f /s /q "C:\xampp\htdocs\marketeaj\*.*"
        
        # Descomprimir el artefacto
        powershell Expand-Archive -Path php_app.zip -DestinationPath "C:\xampp\htdocs\marketeaj" -Force
        
        # Navegar a la carpeta del proyecto
        cd "C:\xampp\htdocs\marketeaj"
        
        # Instalar dependencias de producción si las hay
        composer install --no-dev
        
        # Establecer permisos adecuados
        icacls "C:\xampp\htdocs\marketeaj" /grant Everyone:F /T

    - name: Clean up
      shell: cmd
      run: del php_app.zip