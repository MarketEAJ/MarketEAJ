name: PHP CD

on:
  workflow_run:
    workflows: ["PHP CI"]
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    
    steps:
    - name: Download artifact
      uses: actions/github-script@v6
      with:
        script: |
          const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
            owner: context.repo.owner,
            repo: context.repo.repo,
            run_id: ${{ github.event.workflow_run.id }}
          });
          const matchArtifact = artifacts.data.artifacts.find((artifact) => {
            return artifact.name == "php_app"
          });
          const download = await github.rest.actions.downloadArtifact({
            owner: context.repo.owner,
            repo: context.repo.repo,
            artifact_id: matchArtifact.id,
            archive_format: 'zip'
          });
          const fs = require('fs');
          fs.writeFileSync('php_app.zip', Buffer.from(download.data));

    - name: Deploy to XAMPP
      shell: cmd
      run: |
        echo "Setting up paths..."
        set PATH=%PATH%;C:\xampp\php;C:\composer
        
        echo "Creating directory..."
        if not exist "C:\xampp\htdocs\marketeaj" (
          mkdir "C:\xampp\htdocs\marketeaj"
        )
        
        echo "Cleaning directory..."
        if exist "C:\xampp\htdocs\marketeaj\*.*" (
          del /f /s /q "C:\xampp\htdocs\marketeaj\*.*"
          rmdir /s /q "C:\xampp\htdocs\marketeaj"
          mkdir "C:\xampp\htdocs\marketeaj"
        )
        
        echo "Extracting files..."
        powershell -Command "Expand-Archive -Path php_app.zip -DestinationPath C:\xampp\htdocs\marketeaj -Force"
        
        echo "Setting permissions..."
        takeown /F "C:\xampp\htdocs\marketeaj" /R /D Y
        icacls "C:\xampp\htdocs\marketeaj" /reset
        icacls "C:\xampp\htdocs\marketeaj" /grant everyone:(OI)(CI)F /T
        
        echo "Installing dependencies..."
        cd "C:\xampp\htdocs\marketeaj"
        C:\composer\composer.bat install --no-dev --no-interaction